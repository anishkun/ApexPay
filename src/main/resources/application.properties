spring.application.name=ApexPay

# --- Logging ---
# Structured JSON console logs (Spring Boot native, no extra dependency).
# ECS format automatically includes MDC keys, so the correlationId set by
# CorrelationIdFilter / OutboxRelayWorker / RabbitMQConsumer appears on every line.
# LOG_FORMAT accepts: ecs (default), logstash, gelf, or empty for plain text
# (Boot falls back to the pattern encoder when the value resolves to empty).
logging.structured.format.console=${LOG_FORMAT:ecs}

# --- Tracing (Micrometer Tracing + OpenTelemetry bridge) ---
# With the OTel bridge on the classpath, traceId/spanId land in MDC automatically
# and the ECS structured logs above pick them up on every line.
management.tracing.sampling.probability=${TRACE_SAMPLING:1.0}
# OTLP span export is OFF by default (no collector rollout yet): spans stay in-process
# but still populate MDC. Set TRACING_EXPORT_ENABLED=true + OTLP_ENDPOINT to ship spans.
# (An empty endpoint would fail startup, so the export.enabled flag is the gate and the
# endpoint keeps a syntactically valid default that is only used when the gate is open.)
management.otlp.tracing.export.enabled=${TRACING_EXPORT_ENABLED:false}
management.otlp.tracing.endpoint=${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
# Create AMQP spans and propagate W3C traceparent headers on the template/listener path.
spring.rabbitmq.template.observation-enabled=true
spring.rabbitmq.listener.observation-enabled=true
# Note: the outbox hop intentionally breaks the trace (HTTP tx thread != scheduler relay
# thread); the separate traces are joined by the business correlationId instead.

# --- Database Connection (env-driven; see .env.example) ---
# Local dev: set DB_PASSWORD (no default password is committed).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ApexDB}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# --- Hibernate / JPA Settings ---
# Explicitly tell Spring we are using Postgres
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Production should override DDL_AUTO (e.g. validate/none).
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
# Keep SQL logging off by default; it can leak data in prod logs.
spring.jpa.show-sql=${SHOW_SQL:false}

# Keep the connection stable
spring.datasource.hikari.connection-timeout=30000

# --- RabbitMQ Configuration (env-driven; see .env.example) ---
# guest/guest is RabbitMQ's local-only default (rejected for remote connections).
# Production MUST override RABBITMQ_* via environment variables.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# --- Management / Actuator ---
# Expose only what operations needs; everything else (env, beans, ...) stays hidden.
management.endpoints.web.exposure.include=health,info,prometheus,metrics
# Kubernetes-style probes at /actuator/health/liveness and /actuator/health/readiness
management.endpoint.health.probes.enabled=true
# Health details hidden from anonymous callers (auth arrives with Spring Security).
management.endpoint.health.show-details=when-authorized
# Readiness = readinessState + db only: rabbit is deliberately excluded because the
# outbox pattern tolerates broker outages (events persist and relay later), but a DB
# outage means the payment API genuinely cannot serve traffic.
management.endpoint.health.group.readiness.include=readinessState,db
