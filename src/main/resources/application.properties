spring.application.name=ApexPay

# --- Database Connection (env-driven; see .env.example) ---
# Local dev: set DB_PASSWORD (no default password is committed).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ApexDB}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# --- Hibernate / JPA Settings ---
# Explicitly tell Spring we are using Postgres
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Schema is migration-driven (Flyway). Hibernate only validates that the
# entity mappings match the migrated schema; it never alters it. The value is
# env-overridable, but the default stays 'validate' so Hibernate never fights Flyway.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
# SQL logging off by default; it can leak data in prod logs. Enable via SHOW_SQL for dev.
spring.jpa.show-sql=${SHOW_SQL:false}

# Flyway owns the schema in production.
spring.flyway.enabled=true

# Keep the connection stable
spring.datasource.hikari.connection-timeout=30000

# --- RabbitMQ Configuration (env-driven; see .env.example) ---
# guest/guest is RabbitMQ's local-only default (rejected for remote connections).
# Production MUST override RABBITMQ_* via environment variables.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Publisher confirms: the relay marks an outbox event PUBLISHED only after the
# broker ACKs the message (correlated confirms + waitForConfirms).
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

# Background outbox relay (polls outbox_events and publishes to RabbitMQ).
# Disabled in tests so it never races with assertions.
apexpay.outbox.relay.enabled=true

# Resilient outbox relay tunables.
# Backoff is exponential: delay(attempt) = min(base * 2^(attempt-1), max).
apexpay.outbox.max-attempts=5
apexpay.outbox.backoff-base-ms=1000
apexpay.outbox.backoff-max-ms=60000
apexpay.outbox.batch-size=100
apexpay.outbox.confirm-timeout-ms=5000
# Postgres supports FOR UPDATE SKIP LOCKED so concurrent relays grab disjoint batches.
apexpay.outbox.use-skip-locked=true

# --- Management / Actuator ---
# Expose only what operations needs; everything else (env, beans, ...) stays hidden.
management.endpoints.web.exposure.include=health,info,prometheus,metrics
# Kubernetes-style probes at /actuator/health/liveness and /actuator/health/readiness
management.endpoint.health.probes.enabled=true
# Health details hidden from anonymous callers (auth arrives with Spring Security).
management.endpoint.health.show-details=when-authorized
# Readiness = readinessState + db only: rabbit is deliberately excluded because the
# outbox pattern tolerates broker outages (events persist and relay later), but a DB
# outage means the payment API genuinely cannot serve traffic.
management.endpoint.health.group.readiness.include=readinessState,db
