# Test configuration: runs the full Spring context without live Postgres or RabbitMQ.
# This file shadows src/main/resources/application.properties on the test classpath.

spring.application.name=ApexPay

# Note: logging.structured.format.console is intentionally NOT set here, so test
# output stays plain human-readable text (main's ECS JSON config is shadowed).

# In-memory H2 database in PostgreSQL compatibility mode
spring.datasource.url=jdbc:h2:mem:apexpay;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Fresh schema per test context
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Do not start AMQP listener containers in tests (no live RabbitMQ broker).
# RabbitTemplate connections are lazy, so producers are safe without a broker.
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false

# --- Tracing ---
# Deterministic sampling for tracing assertions (TracingTests). OTLP span export is
# explicitly disabled (mirrors main's TRACING_EXPORT_ENABLED=false default), so tests
# never need a collector. (Most test classes additionally run with tracing disabled by
# the Spring Boot test defaults unless annotated with @AutoConfigureObservability.)
management.tracing.sampling.probability=1.0
management.otlp.tracing.export.enabled=false

# --- Management / Actuator (mirrors main config; this file shadows it) ---
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
# No live broker in tests: disable the rabbit health indicator so overall health stays UP.
management.health.rabbit.enabled=false

# --- Security (HTTP Basic; mirrors SecurityConfig env defaults) ---
# Self-contained test credentials matching the ${..:changeit} defaults in SecurityConfig,
# so SecurityTests/MetricsTests/ActuatorHealthTests can authenticate without real secrets.
API_USER=apiuser
API_PASSWORD=changeit
ACTUATOR_USER=ops
ACTUATOR_PASSWORD=changeit
