# Test configuration: runs the full Spring context without live Postgres or RabbitMQ.
# This file shadows src/main/resources/application.properties on the test classpath.
# An in-memory H2 database stands in for Postgres, and the RabbitMQ-facing
# pieces are quiet by default (the broker integration test opts back in).

spring.application.name=ApexPay

# In-memory H2 database in PostgreSQL compatibility mode. DB_CLOSE_DELAY=-1 keeps
# the schema alive for the life of the JVM even if all connections close.
spring.datasource.url=jdbc:h2:mem:apexpay;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Fresh schema per test context, built by Hibernate against H2.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Fast unit tests build their schema via Hibernate against H2; Flyway/Postgres
# migrations are not run here (a separate Testcontainers harness covers that).
spring.flyway.enabled=false

# Do not start AMQP listener containers in tests (no live RabbitMQ broker).
# RabbitTemplate connections are lazy, so producers are safe without a broker.
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false

# --- Tracing ---
# Deterministic sampling for the tracing assertions (TracingTests). OTLP span export is
# explicitly disabled (mirrors main's TRACING_EXPORT_ENABLED=false default) so tests
# never need a collector. Tracing itself is off by default in Spring Boot tests unless a
# class is annotated with @AutoConfigureObservability.
management.tracing.sampling.probability=1.0
management.otlp.tracing.export.enabled=false

# Publisher confirms so the relay's waitForConfirms path works against the
# Testcontainers broker (harmless for the broker-less H2 unit tests).
spring.rabbitmq.publisher-confirm-type=correlated

# H2 (PostgreSQL mode) does not honour FOR UPDATE SKIP LOCKED the same way;
# the broker integration test uses the portable pessimistic-lock poll instead.
apexpay.outbox.use-skip-locked=false

# The scheduled outbox relay is disabled by default in tests so it never races
# with assertions; OutboxRabbitIntegrationTest turns it on explicitly.
apexpay.outbox.relay.enabled=false

# --- Management / Actuator (mirrors main config; this file shadows it) ---
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
# No live broker in tests: disable the rabbit health indicator so overall health stays UP.
management.health.rabbit.enabled=false
